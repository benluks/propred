# -------------------------
# Data
# -------------------------
data:
  root: /Users/ben/dev/propred/data/LJSpeech-1.1/emb_ids
  pattern: "*.pt"
  batch_size: 32
  num_workers: 0
  pad_value: 0

# -------------------------
# Model
# -------------------------
model:
  embeddings_path: /Users/ben/dev/propred/data/LJSpeech-1.1/embeddings.pt
  filter_channels: 256
  kernel_size: 3
  dropout: 0.1

# -------------------------
# Optimization
# -------------------------
optim:
  lr: 0.001
  weight_decay: 0.01
  loss: l1 # l1 | mse | huber
  epochs: 20

# -------------------------
# Trainer
# -------------------------
trainer:
  accelerator: mps # cpu | gpu | auto
  devices: auto
  precision: 32 # or 16-mixed
  log_every_n_steps: 50
